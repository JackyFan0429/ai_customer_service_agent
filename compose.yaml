services:
  support-agent:
    build: .
    ports:
      - "127.0.0.1:${SUPPORT_HOST_PORT:-8080}:8080"
    environment:
      # Real models use the interactive Python launcher; keep this container local.
      SUPPORT_AGENT_PROVIDER: local
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
