[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krill-customer-agent"
version = "0.1.0"
description = "Evidence-grounded customer support agent for the Krill knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
krill-agent = "krill_agent.cli:main"
krill-agent-web = "krill_agent.web:main"

[tool.setuptools.packages.find]
include = ["krill_agent*"]

[tool.setuptools.package-data]
krill_agent = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
